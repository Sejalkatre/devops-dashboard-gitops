apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-dashboard
  namespace: dev
  labels:
    app: devops-dashboard

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: devops-dashboard

  template:
    metadata:
      labels:
        app: devops-dashboard

    spec:
      imagePullSecrets:
      - name: dockerhub-secret

      containers:
      - name: devops-dashboard

        image: sejalkatre/devops-dashboard:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        env:
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: dashboard-config
              key: APP_NAME

        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: dashboard-config
              key: ENVIRONMENT

        - name: COMPANY
          valueFrom:
            configMapKeyRef:
              name: dashboard-config
              key: COMPANY

        - name: APP_VERSION
          value: "v1"

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
