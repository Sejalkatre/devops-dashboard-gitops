apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-dashboard
  namespace: dev
  labels:
    app: devops-dashboard

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: devops-dashboard

  template:
    metadata:
      labels:
        app: devops-dashboard

    spec:
      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: devops-dashboard
          image: sejalkatre/devops-dashboard:dev-5-10a887d
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: dashboard-config
                  key: APP_NAME

            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: dashboard-config
                  key: ENVIRONMENT

            - name: COMPANY
              valueFrom:
                configMapKeyRef:
                  name: dashboard-config
                  key: COMPANY

            - name: APP_VERSION
              value: "v1"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ✅ Readiness probe (ensures zero downtime)
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

          # ✅ Liveness probe (restarts unhealthy pods)
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3

          # ✅ Graceful shutdown (prevents request drop during rollout)
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
