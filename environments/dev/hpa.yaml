apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: devops-dashboard-hpa
  namespace: dev

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-dashboard

  minReplicas: 2

  maxReplicas: 10

  metrics:
  - type: Resource

    resource:
      name: cpu

      target:
        type: Utilization
        averageUtilization: 50
