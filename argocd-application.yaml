apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-dashboard-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Sejalkatre/devops-dashboard-gitops
    targetRevision: main
    path: environments/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
